<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Sun shop logo pixel art: rising sun over a coin -->
  <rect x="0" y="0" width="16" height="16" fill="#87ceeb"/>
  <!-- sun rays -->
  <rect x="6" y="1" width="4" height="2" fill="#ffd700"/>
  <rect x="2" y="4" width="2" height="2" fill="#ffd700"/>
  <rect x="12" y="4" width="2" height="2" fill="#ffd700"/>
  <!-- sun body -->
  <rect x="4" y="3" width="8" height="7" fill="#ffd700"/>
  <rect x="3" y="4" width="1" height="5" fill="#ffd700"/>
  <rect x="12" y="4" width="1" height="5" fill="#ffd700"/>
  <!-- coin -->
  <rect x="4" y="11" width="8" height="3" fill="#b8860b"/>
  <rect x="6" y="11" width="4" height="1" fill="#ffd700"/>
  <rect x="5" y="12" width="6" height="1" fill="#ffd700"/>
  <rect x="6" y="13" width="4" height="1" fill="#ffd700"/>
</svg>
